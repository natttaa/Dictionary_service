global:
  scrape_interval: 10s

scrape_configs:
  - job_name: service1
    static_configs:
      - targets: ["host.docker.internal:8081"]
  - job_name: service2
    static_configs:
      - targets: ["host.docker.internal:8083"]
  - job_name: health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://host.docker.internal:8081/api/v1/health"]
        labels:
          component: service1-service2-db
      - targets: ["http://host.docker.internal:8083/api/v1/health"]
        labels:
          component: service2-db
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
